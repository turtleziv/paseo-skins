name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: macos-14
            node-version: 22
          - os: macos-14
            node-version: 24
          - os: ubuntu-24.04
            node-version: 22
          - os: windows-2025
            node-version: 22
          - os: windows-2025
            node-version: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.os == 'windows-2025' && matrix.node-version == 24
        run: npm run release:check
